<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin the Bottle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin:0; font-family:sans-serif; background:#c98b4b; color:#fff;
         text-align:center; min-height:100vh; padding:16px; box-sizing:border-box; }
  #table { position:relative; width:260px; height:260px; margin:30px auto;
           border-radius:50%; background:#a8642c; border:6px solid #7a4520; }
  #bottle { position:absolute; left:110px; top:50px; width:40px; height:140px;
            transform-origin:50% 50%; transition:transform 4s cubic-bezier(.17,.67,.12,.99);
            background:linear-gradient(90deg,#1e6b2e,#4fbf5a,#1e6b2e);
            border-radius:20px 20px 45px 45px; }
  textarea { width:100%; height:70px; border-radius:10px; border:none; padding:8px;
             box-sizing:border-box; font-size:16px; }
  button { margin-top:12px; padding:14px 30px; font-size:18px; border:none;
           border-radius:12px; background:#f08c3c; color:#fff; }
  #result { font-size:22px; margin-top:20px; min-height:60px; }
</style>
</head>
<body>
<h2>🍾 Spin the Bottle</h2>
<textarea id="names" placeholder="Ismlar, vergul bilan: Ali, Vali, Sardor, Dilnoza"></textarea>
<div id="table"><div id="bottle"></div></div>
<button onclick="spin()">Aylantirish</button>
<div id="result"></div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();

  let rot = 0;
  const bottle = document.getElementById('bottle');

  function spin() {
    const names = document.getElementById('names').value
      .split(',').map(s => s.trim()).filter(Boolean);
    if (names.length < 2) {
      alert("Kamida 2 ta ism kiriting");
      return;
    }
    rot += 1440 + Math.random() * 360;
    bottle.style.transform = `rotate(${rot}deg)`;
    document.getElementById('result').textContent = "";

    setTimeout(() => {
      const angle = ((rot % 360) + 360) % 360;
      const n = names.length;
      const a = Math.floor(angle / (360 / n)) % n;
      let b;
      do { b = Math.floor(Math.random() * n); } while (b === a);
      document.getElementById('result').textContent =
        `🍾 ${names[a]} → ${names[b]}`;
    }, 4000);
  }
</script>
</body>
</html>
